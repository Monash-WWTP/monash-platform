services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: wwtp
      POSTGRES_PASSWORD: wwtp
      POSTGRES_DB: wwtp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wwtp']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
# To use Postgres instead of the default SQLite:
#   docker compose up -d db
#   export DATABASE_URL=postgresql+psycopg2://wwtp:wwtp@localhost:5432/wwtp
#   uv pip install -e "./backend[postgres]"
#   then start the backend as usual
