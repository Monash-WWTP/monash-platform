<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:24px 12px;background:#f2f6f3;font-family:Arial,sans-serif;color:#202724;">
<table role="presentation" style="width:100%;max-width:560px;margin:auto;background:#ffffff;border-collapse:collapse;">
<tr><td style="padding:28px 24px 0;"><img src="https://monash-water-platform.vercel.app/assets/app/citizenflood-icon.png" width="56" height="56" alt="CitizenFlood logo"><p style="font-size:16px;font-weight:bold;">CitizenFlood · Monash Water</p></td></tr>
<tr><td style="padding:24px;color:#202724;font-family:Arial,sans-serif;">
<h1 style="font-size:24px;">{% block title %}{% endblock %}</h1>
{% block message %}{% endblock %}
{% block action %}<p style="padding:16px 0;"><a id="confirm" href="{{ url }}" rel="noopener noreferrer" style="background:#146346;color:#ffffff;padding:14px 22px;text-decoration:none;border-radius:8px;display:inline-block;">{% block action_label %}{% endblock %}</a></p>{% endblock %}
{% block help %}{% endblock %}
</td></tr>
<tr><td style="padding:24px;font-size:12px;color:#58635d;">CitizenFlood · Monash Water{% block expiry %}{% endblock %}</td></tr>
</table></body></html>
