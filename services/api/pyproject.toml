[project]
name = "wwtp-backend"
version = "0.1.0"
description = "WWTP dashboard API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "wwtp-sim",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
    "boto3>=1.35,<2",
    "python-multipart>=0.0.20",
    "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.sources]
wwtp-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
