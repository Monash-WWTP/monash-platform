name: inventory
on: [push, pull_request]
permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group research
      - run: uv run --locked python scripts/check_import_inventory.py --verify-targets
      - run: uv run --locked python scripts/check_repository.py
      - run: uv run --locked pytest -q tests
      - run: uv run --locked --group research python research/run_notebook.py
