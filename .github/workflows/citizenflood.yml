name: citizenflood
on: [push, pull_request]
permissions:
  contents: read

jobs:
  citizenflood:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/citizenflood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=synthetic-ci-key
      - run: test -s build/app/outputs/flutter-apk/app-debug.apk
